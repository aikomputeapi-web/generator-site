server {
  listen ${PORT};
  server_name _;

  root /app/dist;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Python Flask backend (Wells Fargo / ReportLab PDF generation)
  location /api/bankstatement/ {
    # Strip /api/bankstatement prefix before forwarding to Flask
    rewrite ^/api/bankstatement/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # Node Express backend (auth, documents)
  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # Serve Wells Fargo static assets (logo, generated PDFs) directly from Flask
  location ~* /static/ {
    proxy_pass http://127.0.0.1:5001;
  }
}
